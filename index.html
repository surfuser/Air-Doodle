<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Doodle - Multi-Hand Precision</title>
  
  <!-- MediaPipe Hands CDN Links -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Full-screen video and canvas overlays */
    #webcam, #drawingCanvas, #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror for natural interaction */
    }

    #webcam {
      z-index: 1;
    }

    #drawingCanvas {
      z-index: 2;
    }

    #overlayCanvas {
      z-index: 3;
      pointer-events: none;
    }

    /* Top Left Credit Text */
    .top-left-credit {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Top Center Title Text */
    .top-center-title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 24px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Vertical Color Palette on Right Side */
    .palette-container {
      position: absolute;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.55);
      padding: 20px 14px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .color-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .color-swatch:hover {
      transform: scale(1.15);
    }

    .color-swatch.active {
      border-color: #ffffff;
      transform: scale(1.25);
      box-shadow: 0 0 12px currentColor;
    }

    /* Custom Color Picker Input Styling */
    .custom-color-wrapper {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px dashed rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .custom-color-wrapper:hover {
      transform: scale(1.15);
    }

    #customPicker {
      position: absolute;
      opacity: 0;
      width: 200%;
      height: 200%;
      cursor: pointer;
    }

    /* Size Slider Indicator */
    .size-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 12px;
    }

    .size-control label {
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    #brushSize {
      writing-mode: bt-lr;
      appearance: slider-vertical;
      width: 16px;
      height: 90px;
      cursor: pointer;
    }

    /* Bottom Center Controls */
    .bottom-center-controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    #clearBtn {
      padding: 12px 28px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background-color: #e63946;
      color: white;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
      transition: all 0.2s ease;
    }

    #clearBtn:hover {
      background-color: #d62828;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Top Left Info -->
  <div class="top-left-credit">Made By Shabd Singh - 9th D</div>

  <!-- Top Center Instruction -->
  <div class="top-center-title">Pinch to Doodle</div>

  <!-- Webcam & Layered Canvases -->
  <video id="webcam" playsinline></video>
  <canvas id="drawingCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>

  <!-- Right Side Vertical Color Palette -->
  <div class="palette-container">
    <div class="color-swatch active" style="background-color: #00f5d4;" data-color="#00f5d4"></div>
    <div class="color-swatch" style="background-color: #ff007f;" data-color="#ff007f"></div>
    <div class="color-swatch" style="background-color: #ffbe0b;" data-color="#ffbe0b"></div>
    <div class="color-swatch" style="background-color: #3a86ff;" data-color="#3a86ff"></div>
    <div class="color-swatch" style="background-color: #8338ec;" data-color="#8338ec"></div>
    <div class="color-swatch" style="background-color: #ffffff;" data-color="#ffffff"></div>

    <!-- Custom Color Picker -->
    <div class="custom-color-wrapper" title="Choose Custom Color">
      <span style="color: white; font-size: 18px; font-weight: bold; pointer-events: none;">+</span>
      <input type="color" id="customPicker" value="#00f5d4">
    </div>

    <!-- Brush Size Selector -->
    <div class="size-control">
      <label for="brushSize">Size</label>
      <input type="range" id="brushSize" min="2" max="30" value="6">
    </div>
  </div>

  <!-- Bottom Center Control -->
  <div class="bottom-center-controls">
    <button id="clearBtn">Clear Canvas</button>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const drawCanvas = document.getElementById('drawingCanvas');
    const drawCtx = drawCanvas.getContext('2d');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const clearBtn = document.getElementById('clearBtn');
    const swatches = document.querySelectorAll('.color-swatch');
    const customPicker = document.getElementById('customPicker');
    const brushSizeInput = document.getElementById('brushSize');

    // Preset color map for simultaneous hand separation
    const defaultHandColors = ['#00f5d4', '#ff007f', '#ffbe0b', '#3a86ff', '#8338ec', '#ffffff'];

    // Global Primary Brush Settings
    let strokeColor = '#00f5d4';
    let strokeWidth = 6;

    // Multi-hand state tracking object
    const handStates = {};

    // Color Selection logic
    swatches.forEach(swatch => {
      swatch.addEventListener('click', (e) => {
        swatches.forEach(s => s.classList.remove('active'));
        e.target.classList.add('active');
        strokeColor = e.target.getAttribute('data-color');
      });
    });

    // Custom Color Picker Logic
    customPicker.addEventListener('input', (e) => {
      swatches.forEach(s => s.classList.remove('active'));
      strokeColor = e.target.value;
    });

    // Dynamic Brush Size Slider Logic
    brushSizeInput.addEventListener('input', (e) => {
      strokeWidth = parseInt(e.target.value, 10);
    });

    // Resize canvas layers to match window dimensions
    function resizeCanvas() {
      drawCanvas.width = window.innerWidth;
      drawCanvas.height = window.innerHeight;
      overlayCanvas.width = window.innerWidth;
      overlayCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Initialize MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 4,             // Track up to 4 hands simultaneously
      modelComplexity: 1,         // Full accurate tracking model
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    // Setup Webcam Feed
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });
    camera.start();

    function onResults(results) {
      // Clear overlay canvas for real-time tracking indicators
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      const activeHandIndices = new Set();

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        results.multiHandLandmarks.forEach((landmarks, index) => {
          activeHandIndices.add(index);

          // Assign default or custom color per hand
          const handColor = (index === 0) ? strokeColor : (defaultHandColors[index % defaultHandColors.length]);

          // Initialize hand state if not present
          if (!handStates[index]) {
            handStates[index] = {
              isDrawing: false,
              currX: 0,
              currY: 0,
              lastX: 0,
              lastY: 0
            };
          }

          const state = handStates[index];

          // Key Hand Landmarks
          const wrist = landmarks[0];
          const middleMCP = landmarks[9];
          const thumbTip = landmarks[4];
          const indexTip = landmarks[8];

          // Reference scale for depth invariance (Wrist to Middle Joint distance)
          const handScale = Math.hypot(
            middleMCP.x - wrist.x,
            middleMCP.y - wrist.y,
            middleMCP.z - wrist.z
          );

          // Direct 3D distance between Index Tip and Thumb Tip
          const rawPinchDistance = Math.hypot(
            thumbTip.x - indexTip.x,
            thumbTip.y - indexTip.y,
            thumbTip.z - indexTip.z
          );

          // Scaled ratio
          const pinchRatio = rawPinchDistance / (handScale || 1);

          // Hysteresis thresholding
          const PINCH_START = 0.35;
          const PINCH_END = 0.48;

          const isPinchingNow = state.isDrawing ? (pinchRatio < PINCH_END) : (pinchRatio < PINCH_START);

          // Pinch Midpoint Coordinates
          const rawX = ((thumbTip.x + indexTip.x) / 2) * drawCanvas.width;
          const rawY = ((thumbTip.y + indexTip.y) / 2) * drawCanvas.height;

          // Low-pass Exponential Moving Average (EMA) position smoothing filter
          const alpha = 0.35; // Smoothing factor
          if (!state.isDrawing && !isPinchingNow) {
            state.currX = rawX;
            state.currY = rawY;
          } else {
            state.currX = state.currX + alpha * (rawX - state.currX);
            state.currY = state.currY + alpha * (rawY - state.currY);
          }

          // Render Tracking Indicators on Overlay Layer
          overlayCtx.beginPath();
          overlayCtx.arc(state.currX, state.currY, isPinchingNow ? strokeWidth * 0.8 : 8, 0, 2 * Math.PI);
          overlayCtx.fillStyle = isPinchingNow ? handColor : 'rgba(255, 255, 255, 0.8)';
          overlayCtx.strokeStyle = '#000';
          overlayCtx.lineWidth = 2;
          overlayCtx.fill();
          overlayCtx.stroke();

          // Perform Drawing Operations
          if (isPinchingNow) {
            if (!state.isDrawing) {
              state.isDrawing = true;
              state.lastX = state.currX;
              state.lastY = state.currY;
            } else {
              drawCtx.beginPath();
              drawCtx.moveTo(state.lastX, state.lastY);
              drawCtx.lineTo(state.currX, state.currY);
              drawCtx.strokeStyle = handColor;
              drawCtx.lineWidth = strokeWidth;
              drawCtx.lineCap = 'round';
              drawCtx.lineJoin = 'round';

              // Neon Glow FX
              drawCtx.shadowColor = handColor;
              drawCtx.shadowBlur = strokeWidth * 1.2;

              drawCtx.stroke();

              // Reset shadow context for efficiency
              drawCtx.shadowBlur = 0;

              state.lastX = state.currX;
              state.lastY = state.currY;
            }
          } else {
            state.isDrawing = false;
          }
        });
      }

      // Cleanup inactive hand states
      Object.keys(handStates).forEach((indexKey) => {
        const index = parseInt(indexKey, 10);
        if (!activeHandIndices.has(index)) {
          handStates[index].isDrawing = false;
        }
      });
    }

    // Clear Canvas
    clearBtn.addEventListener('click', () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    });
  </script>
</body>
</html>
